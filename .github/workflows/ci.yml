name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

permissions:
  contents: read

env:
  # CI makes no commits, so the `vp config` prepare script skips the git hooks.
  VP_GIT_HOOKS: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Format (oxfmt), lint (oxlint, type-aware) and typecheck (tsrs).
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Vitest against the built CLI, on Linux, macOS and Windows, with Node 22 and 24.
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 25 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Codex runs hooks with the user's $SHELL, so the hook's shell form is tested in fish and zsh too.
      - name: Install fish and zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fish zsh
      - run: pnpm test

  # The real timer: install the packed package, let systemd, launchd or Task Scheduler run the sync
  # on a one-minute cron, check `status`, reinstall to prove nothing changes, and remove it
  # (.github/scripts/timer-e2e.mjs).
  timer-e2e:
    name: timer e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Bash runs on every GitHub runner; Windows defaults to PowerShell.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: pnpm pack --out "$RUNNER_TEMP/fleetrc.tgz"
      # The runner user has no login session, so it has no systemd user manager. Linger starts one,
      # as on a server.
      - name: Start the systemd user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          runtime_dir="/run/user/$(id -u)"
          for _ in $(seq 1 30); do
            if [ -S "$runtime_dir/bus" ]; then break; fi
            sleep 1
          done
          if [ ! -S "$runtime_dir/bus" ]; then
            echo "::error::The systemd user manager did not start: $runtime_dir/bus is missing."
            exit 1
          fi
          {
            echo "XDG_RUNTIME_DIR=$runtime_dir"
            echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$runtime_dir/bus"
          } >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$runtime_dir" systemctl --user is-system-running --wait || true
      - name: Install fleetrc, let the OS timer sync twice, remove it
        run: node .github/scripts/timer-e2e.mjs "$RUNNER_TEMP/fleetrc.tgz"

  # The session hooks as the agents run them: init writes them into a throwaway HOME's Claude Code
  # and Codex files, each runs through a shell from a parent that exits at once, and the sync it
  # starts must outlive both (.github/scripts/hook-e2e.mjs).
  hook-e2e:
    name: hook e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack
        run: pnpm pack --out "$RUNNER_TEMP/fleetrc.tgz"
      - name: Run the session hooks as Claude Code and Codex do, and wait for their syncs
        run: node .github/scripts/hook-e2e.mjs "$RUNNER_TEMP/fleetrc.tgz"

  # Windows breaks that change the machine or need the real Task Scheduler: a subst drive for HOME
  # (test/windows.test.ts, W-SUBST), and the timer e2e under a USERPROFILE with
  # cmd and PowerShell metacharacters, with and without a %VAR% in it.
  windows-break:
    name: windows-break (node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Windows break tests, with subst
        env:
          FLEETRC_BREAK_SUBST: "1"
        run: pnpm exec vp test run test/windows.test.ts
      - name: Pack
        if: ${{ !cancelled() }}
        run: pnpm pack --out "$RUNNER_TEMP/fleetrc.tgz"
      - name: Task Scheduler e2e under a USERPROFILE with metacharacters
        if: ${{ !cancelled() }}
        run: node .github/scripts/timer-e2e.mjs "$RUNNER_TEMP/fleetrc.tgz" --home-name "O'Brien & Zoë ^ ! (x) \$(whoami) 😀"
      - name: Task Scheduler e2e under a USERPROFILE with %PATH% in it
        if: ${{ !cancelled() }}
        run: node .github/scripts/timer-e2e.mjs "$RUNNER_TEMP/fleetrc.tgz" --home-name "pct %PATH% home"
